<style>
:root{--bg:#fdf6ea;--sf:#fffaf1;--ink:#0d1d4d;--mut:#6b7699;--bl:#3b6cf0;--bl2:#2b52d6;--line:#ece3d0;--yel:#ffc93c;--bad:#d6334f;--ok:#2f8a4e;--chip:#f5e6c8;--sh:0 8px 22px -14px #3b6cf066;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1431;--sf:#16224d;--ink:#eaf0ff;--mut:#9fb0e0;--bl:#6f93ff;--line:#2a3868;--chip:#22305f;--bad:#ff8aa0;--ok:#7fd69a;color-scheme:dark}}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:14px 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
main{flex:1;overflow-y:auto;padding:14px 16px 18px}h1,h2,.num{font-family:'Baloo 2',sans-serif}
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h1{font-size:22px;flex:1}.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{background:none;border:0;color:var(--ink);position:relative;cursor:pointer}.dot{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;font-weight:800}
.av{width:34px;height:34px;border-radius:50%;background:var(--bl2);color:#fff;display:grid;place-items:center;font-weight:800}
.hero{background:linear-gradient(135deg,var(--bl),var(--bl2));color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}.hero .num{font-size:38px;font-weight:800;line-height:1.1}.up{color:#7fe3a0;font-weight:800;font-size:13px}.dn{color:var(--bad)}
.logo{font-family:'Baloo 2';font-weight:800;line-height:.85;font-size:40px;color:var(--bl2);letter-spacing:-1px}.logo small{display:block;font-size:9px;letter-spacing:2px;margin-top:4px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.row3 .card{text-align:center;margin:0;padding:12px 6px}.row3 b{display:block;font-family:'Baloo 2';font-size:20px}.row3 span{font-size:12px;color:var(--mut)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;border:0;background:var(--chip);color:var(--ink);padding:9px;border-radius:20px;font:700 13px inherit;font-family:inherit;cursor:pointer}.seg .on{background:var(--bl);color:#fff}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li img{width:46px;height:46px;border-radius:10px;object-fit:cover}.li .g{flex:1}.li small{color:var(--mut);display:block}
.pill{background:#d8f0cf;color:#24632f;padding:4px 12px;border-radius:10px;font-size:12px;font-weight:700}.pill.p{background:#fff0b8;color:#7a5a00}.pill.x{background:#fbd5dc;color:#8d1a30}
.low{color:var(--bad);font-weight:800;font-size:13px}h2{font-size:17px;margin-bottom:8px}
nav{display:flex;border-top:1px solid var(--line);background:var(--sf);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px 'Plus Jakarta Sans';cursor:pointer;padding:4px}nav .on{color:var(--bl)}

${open&&nx?`<button class="out" style="background:var(--bl)" onclick="adv()">Mark as ${nx[1]}</button><button class="out" style="background:var(--chip);color:var(--ink);margin-top:10px" onclick="cnq()">Cancel order</button>`:''}`},
FlavorD(){const p=P[FI]||P[0],it=REAL?IMP.items[FI]:null,pr=it?it.price:p.pr,co=it?it.cost:0,per=pr&&co>0?pr-co:null,cut=Date.now()-rng*864e5;
const sold=REAL?sum(IMP.orders.filter(o=>o.st==='ok'&&o.t>cut).flatMap(o=>o.lines.filter(l=>l.n===p.n).map(l=>l.q))):null,dly=sold?sold/rng:0,lo=lt(p),stt=p.st<=0?['Out of stock','x']:p.st<=lo?['Low','p']:['In stock',''];
return `<div class="top"><button class="btn" onclick="go('Inventory')">${ic('back')}</button><h1>${esc(p.n)}</h1><span class="pill ${stt[1]}">${stt[0]}</span></div>
<div class="card">${PIC[p.k]?`<img class="fimg" src="${PIC[p.k]}" alt="">`:''}<div class="sr"><span>Price</span><b>${pr?peso(pr):'—'}</b></div><div class="sr"><span>Cost per cup</span><b>${co>0?peso(co):'Not set'}</b></div><div class="sr"><span>Profit per cup</span><b>${per!==null?peso(per)+' ('+Math.round(per/pr*100)+'%)':'—'}</b></div></div>
<div class="card"><div class="sr"><span>Cups left</span><b class="${p.st<=lo?'low':''}">${p.st}</b></div><div class="sr"><span>Warns at</span><b>${lo} cups</b></div>${REAL?`<div class="sr"><span>Sold, last ${rng} days</span><b>${sold} cups</b></div><div class="sr"><span>Stock lasts about</span><b>${dly?Math.floor(p.st/dly)+' days':'—'}</b></div>`:''}<div class="sr"><span>Share of sales</span><b>${p.sh}%</b></div></div>
<div class="card" style="background:var(--chip)"><small>${REAL?(dly&&p.st/dly<3?'At this pace it runs out in under 3 days. Worth making more.':'Looks fine for now.'):'Import your POS numbers to see real sales and how long stock lasts.'}</small></div>`},
OrderD(){const o=REAL?IMP.orders.find(x=>x.no===OD):null,r=ORD.find(x=>x[0]===OD)||[];const ls=o?o.lines:[{n:((P0.find(p=>p.k===r[3])||{}).n)||'Item',q:1,t:r[2]}],tot=o?o.total:r[2],st=o?(o.st==='ok'?'Completed':'Refunded'):r[4];
return `<div class="top"><button class="btn" onclick="go('More','Orders')">${ic('back')}</button><h1>${esc(OD)}</h1><span class="pill ${st=='Pending'?'p':st=='Refunded'?'x':''}">${st}</span></div><div class="card"><small style="color:var(--mut)">${o?fm(o.t):r[1]||''}${o&&o.by?' · Cashier '+esc(o.by):''}${o&&o.cust?' · '+esc(o.cust):''}</small>${ls.map(l=>`<div class="sr"><span>${l.q} × ${esc(l.n)}</span><b>${peso(l.t)}</b></div>`).join('')}<div class="sr"><b>Total</b><b>${peso(tot)}</b></div></div>${o?'':'<p style="color:var(--mut)">Demo order. Real orders show every item.</p>'}`},
Import(){return `<div class="top"><button class="btn" onclick="go('More')">${ic('back')}</button><h1>Import from POS</h1></div>
<div class="card"><h2>1. In the POS</h2><p style="color:var(--mut)">Settings → Owner app → <b>Export file</b> (or <b>Copy data</b>).</p></div>
<div class="card"><h2>2. Here</h2><p style="color:var(--mut);margin-bottom:8px">Pick the file:</p><input type="file" accept=".json,application/json" onchange="impFile(this)" style="width:100%;margin-bottom:12px">
<p style="color:var(--mut);margin-bottom:8px">Or paste the copied data:</p><textarea id="pt" style="width:100%;height:90px;border-radius:10px;border:1px solid var(--line);padding:8px;background:var(--bg);color:var(--ink)"></textarea><button class="out" style="background:var(--bl);margin-top:10px" onclick="impText(document.getElementById('pt').value)">Import</button></div>
${REAL?`<div class="card"><small style="color:var(--mut)">Last import: ${fm(IMP.at)} · ${IMP.orders.length} orders</small><button class="out" style="margin-top:10px;background:var(--chip);color:var(--ink)" onclick="localStorage.removeItem(KEY);IMP=null;go('Home')">Go back to demo data</button></div>`:''}`},
Settings(){const tg=(k,l,d)=>`<label class="sr"><span>${l}<small style="display:block;color:var(--mut)">${d}</small></span><input type="checkbox" ${CFG[k]?'checked':''} onchange="setC('${k}',this.checked?1:0)"></label>`;
return `<div class="top"><button class="btn" onclick="go('More')">${ic('back')}</button><h1>Business Settings</h1></div>
<div class="card"><h2>Targets</h2><label class="fl">Daily sales goal (₱)<small>Shows a progress bar on Home. 0 hides it.</small><input type="number" min="0" inputmode="numeric" value="${CFG.goal}" onchange="setC('goal',Math.max(0,+this.value||0))"></label>
<label class="fl">Low-stock warning (cups)<small>Warn at or below this. 0 uses each flavor's level from the POS.</small><input type="number" min="0" inputmode="numeric" value="${CFG.low}" onchange="setC('low',Math.max(0,+this.value||0))"></label></div>
<div class="card"><h2>Look</h2><div class="seg" style="margin:8px 0 0">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="${CFG.theme==k?'on':''}" onclick="setC('theme','${k}',1)">${l}</button>`).join('')}</div></div>
<div class="card"><h2>Alerts</h2>${tg('aLow','Low stock','When a flavor runs low')}${tg('aOrd','New orders','Latest sales from the POS')}${tg('aMile','Milestones','Sales goals reached')}</div>`},
Profile(){return `<div class="top"><button class="btn" onclick="go('More')">${ic('back')}</button><h1>Profile</h1></div>
<div class="card"><div class="av" style="width:64px;height:64px;font-size:26px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center">${esc((CFG.owner||'G').trim()[0]||'G').toUpperCase()}</div>
<label class="fl">Your name<input type="text" value="${esc(CFG.owner)}" placeholder="e.g. Ana" onchange="setC('owner',this.value.trim())"></label>
<label class="fl">Shop name<input type="text" value="${esc(CFG.shop)}" onchange="setC('shop',this.value.trim()||'Patty Burps')"></label>
<label class="fl">GCash number<small>Put in your payment messages to customers.</small><input type="tel" value="${esc(CFG.gcash)}" onchange="setC('gcash',this.value.trim())"></label>
<label class="fl">Phone or email<small>Only kept on this phone.</small><input type="text" value="${esc(CFG.phone)}" onchange="setC('phone',this.value.trim())"></label></div>`},
Help(){const d=(q,a)=>`<details><summary>${q}</summary><p>${a}</p></details>`;return `<div class="top"><button class="btn" onclick="go('More')">${ic('back')}</button><h1>Help & Support</h1></div>
<div class="card">${d('Can I see a quick tour?','<button class="out" style="background:var(--bl);width:auto;padding:10px 16px" onclick="tour(0)">Start the tour</button>')}
${d('How do online orders work?','Website orders will show up in Inbox by themselves once the online setup is done. Until then, add orders from calls or messages with + New. Open an order, set the delivery fee, message the customer, book Lalamove or another courier, then move it step by step to Delivered.')}
${d('How do I get my POS numbers here?','In the POS open Settings, then Owner app, and tap Export file (or Copy data). Here go to More, Import from POS, and pick the file or paste the data.')}
${d('Why does it say Demo data?','You have not imported yet. Demo numbers are only there so you can see how the screens look.')}
${d('Is it live?','Not yet. The phone shows the numbers from your last export, so export again to refresh. Live sync comes later with an online account.')}
${d('What do the percentages compare to?','Today against the same weekday last week. Ranges compare with the period just before.')}
${d('Where is my data kept?','Only on this phone, in this browser. Clearing browser data, or Reset this app, removes it.')}
${d('The low-stock list looks wrong','Open Business Settings. A warning level above 0 replaces each flavor\'s level from the POS.')}</div>`},
About(){return `<div class="top"><button class="btn" onclick="go('More')">${ic('back')}</button><h1>About</h1></div><div class="card about"><img src="${LG}" alt=""><h2>${esc(CFG.shop)}</h2><p>Pudding cups</p><small style="color:var(--mut)">Owner app. It shows the numbers you export from the POS, and they stay on this phone.</small></div>`},
More(){return `<div class="head">${logo}</div><div class="card menu">${[['⚙️','Business Settings','Settings'],['👤','Profile','Profile'],['📥','Import from POS','Import'],['🛒','Orders','Orders'],['🔔','Notifications','Notifications'],['❓','Help & Support','Help'],['ℹ️','About Patty Burps','About']].map(([e,t,s])=>`<div class="li" onclick="${s?`go('More','${s}')`:`alert('${t}: coming soon')`}"><span style="font-size:20px">${e}</span><span>${t}</span>›</div>`).join('')}</div><button class="out" style="background:var(--chip);color:var(--ink);margin-bottom:10px" onclick="tour(0)">🧭 Take a tour</button><button class="out" onclick="if(confirm('Clear the imported POS data and your settings on this phone?')){localStorage.removeItem(KEY);localStorage.removeItem(CK);location.reload()}">Reset this app</button>`}};
function impText(t){try{const d=JSON.parse(t);if(d.v!==1||!Array.isArray(d.orders)||!Array.isArray(d.items))throw 0;IMP=d;try{localStorage.setItem(KEY,t)}catch(e){}go('Home')}catch(e){alert('That does not look like a Patty Burps POS export. Export it again from the POS Settings.')}}
function impFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>impText(r.result);r.readAsText(f)}
function nvDraw(){document.getElementById('nv').innerHTML=['Home','Inbox','Sales','Inventory','Reports','More'].map(t=>`<button class="${tab==t?'on':''}" onclick="go('${t}')">${ic(t)}${t==='Inbox'&&inew()?'Inbox · '+inew():t}</button>`).join('')}
function draw(){load();const k=sub||tab;document.getElementById('m').innerHTML=V[k]();document.getElementById('m').scrollTop=0;nvDraw()}
function go(t,s){tab=t;sub=s||null;draw()}draw();hstart();
(function(){const s=document.getElementById('sp');if(!s)return;try{document.getElementById('spt').textContent=REAL?'Last updated '+ago(IMP.at):'Showing demo data';if(sessionStorage.getItem('pbs'))return s.remove();sessionStorage.setItem('pbs',1);setTimeout(()=>{s.classList.add('out');setTimeout(()=>s.remove(),400)},1100)}catch(e){s.remove()}})();
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})</script>
</body></html>
